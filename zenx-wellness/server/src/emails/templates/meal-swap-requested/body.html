<div style="font-family:'DM Sans',Arial,sans-serif;background:#fbf8f1;padding:32px;color:#193b34;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;box-shadow:0 18px 50px rgba(31,68,56,.11);">
    <h1 style="font-family:'Playfair Display',Georgia,serif;color:#173f36;font-size:24px;margin:0 0 16px;">Hi {{dietitian_name}}</h1>
    <p style="margin:0 0 16px;line-height:1.5;"><strong>{{client_name}}</strong> asked to swap a meal on their weekly plan.</p>
    <p style="margin:0 0 24px;padding:12px 16px;background:#dce9d8;border-radius:12px;line-height:1.5;">
      <strong>{{meal_title}}</strong><br />
      {{meal_type}} · {{meal_when}}
    </p>
    <p style="margin:0 0 24px;line-height:1.5;">Open their profile to review the request and update the plan.</p>
    <a href="{{login_url}}" style="display:inline-block;background:#ec7958;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:bold;">View client</a>
  </div>
</div>
