<div style="font-family:'DM Sans',Arial,sans-serif;background:#fbf8f1;padding:32px;color:#193b34;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;box-shadow:0 18px 50px rgba(31,68,56,.11);">
    <h1 style="font-family:'Playfair Display',Georgia,serif;color:#173f36;font-size:24px;margin:0 0 16px;">Hi {{client_name}}</h1>
    <p style="margin:0 0 16px;line-height:1.5;">{{dietitian_name}} swapped a meal on your weekly plan.</p>
    <p style="margin:0 0 24px;padding:12px 16px;background:#dce9d8;border-radius:12px;line-height:1.5;">
      {{meal_type}} · {{meal_when}}<br />
      <span style="text-decoration:line-through;opacity:.7;">{{previous_meal}}</span><br />
      <strong>{{new_meal}}</strong>
    </p>
    <p style="margin:0 0 24px;line-height:1.5;">It's ready to view on This week's meals.</p>
    <a href="{{login_url}}" style="display:inline-block;background:#ec7958;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:bold;">View my plan</a>
  </div>
</div>
