<div style="font-family:'DM Sans',Arial,sans-serif;background:#fbf8f1;padding:32px;color:#193b34;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;box-shadow:0 18px 50px rgba(31,68,56,.11);">
    <h1 style="font-family:'Playfair Display',Georgia,serif;color:#173f36;font-size:24px;margin:0 0 16px;">Hi {{dietitian_name}}</h1>
    <p style="margin:0 0 16px;line-height:1.5;">This is a reminder — your call with <strong>{{client_name}}</strong> is coming up at:</p>
    <p style="margin:0 0 24px;padding:12px 16px;background:#dce9d8;border-radius:12px;font-weight:bold;">{{meeting_time}}</p>
    <a href="{{join_url}}" style="display:inline-block;background:#ec7958;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:bold;">{{join_label}}</a>
  </div>
</div>
